/* RGB565 → CSS */
function rgb565(v){
  const r=((v>>11)&0x1f)*8, g=((v>>5)&0x3f)*4, b=(v&0x1f)*8;
  return `rgb(${r},${g},${b})`;
}

/* ── 模拟 ST7789 绘制 API ── */
function fill(color){ ctx.fillStyle=rgb565(color); ctx.fillRect(0,0,284,76); }
function fillRect(x,y,w,h,color){ ctx.fillStyle=rgb565(color); ctx.fillRect(x,y,w,h); }
function drawPixel(x,y,color){ ctx.fillStyle=rgb565(color); ctx.fillRect(x,y,1,1); }
function drawHLine(x,y,w,color){ fillRect(x,y,w,1,color); }
function drawVLine(x,y,h,color){ fillRect(x,y,1,h,color); }

/* drawString: 5×7 位图，z=缩放。fy=固件坐标（0=底部），转换到 HTML（0=顶部）。
 * 反转行序模拟固件 MADCTL 扫描方向（与固件显示一致）。 */
function drawString(str, fx, fy, z, color){
  const fw=5*z, fh=8*z;
  const hy=76-fy-fh;              /* 固件 y=0 底部 → HTML 底部 */
  let x=fx;
  for(const ch of str){
    const g=FONT[ch]||[0,0,0,0,0];
    for(let col=0;col<5;col++){
      for(let row=0;row<8;row++){
        let r = 7-row;             /* 反转行序 */
        if(g[col]&(0x80>>r)){
          fillRect(x+col*z, hy+row*z, z, z, color);
        }
      }
    }
    x+=fw+z;                        /* 字符+间距 */
  }
}

/* 电池图标（fy=固件坐标） */
function battery(x,fy){
  const y=76-fy-7;
  drawHLine(x,y,12,WHITE); drawHLine(x,y+6,12,WHITE);
  drawVLine(x,y,7,WHITE);   drawVLine(x+11,y,7,WHITE);
  drawPixel(x+12,y+2,WHITE); drawPixel(x+12,y+3,WHITE); drawPixel(x+12,y+4,WHITE);
  fillRect(x+1,y+1,8,5,WHITE);
}

/* 对勾（fy=固件坐标） */
function check(x,fy){
  const y=76-fy-5;
  const p=[[0,4],[1,3],[2,2],[3,1],[4,0],[2,4],[3,3]];
  for(const [dx,dy] of p) drawPixel(x+dx,y+dy,GREEN);
}

/* ── 首页渲染（固件坐标，与 ui.c 一致） ── */
function renderHome(h,m,s){
  const date=new Date();
  const pad=n=>String(n).padStart(2,'0');

  fill(BLACK);
  /* 顶部：USB MODE + 电池 */
  drawString('USB MODE', 0, 64, 1, GREEN);
  battery(250, 62);

  /* 中间：HH:MM（4× 居中）+ 秒（2×，底部对齐） */
  drawString(`${pad(h)}:${pad(m)}`, 84, 22, 4, WHITE);
  drawString(pad(s), 205, 22, 2, WHITE);

  /* 底部：自定义文字（左下）+ 日期 + 模式 */
  drawString('FinPad', 0, 0, 1, YELLOW);       /* 自定义文字示例 */
  const y=date.getFullYear(), mo=pad(date.getMonth()+1), d=pad(date.getDate());
  drawString(`${y}-${mo}-${d}`, 112, 8, 1, YELLOW);
  drawString('MODA', 210, 0, 1, YELLOW);
  check(240, 0);
}

/* ── 实时走秒 ── */
let t=new Date();
function tick(){
  t=new Date(t.getTime()+1000);
  renderHome(t.getHours(), t.getMinutes(), t.getSeconds());
}
renderHome(t.getHours(), t.getMinutes(), t.getSeconds());
setInterval(tick, 1000);
