<body>
<h2>ST7789 284×76 模拟器（首页）</h2>
<canvas id="tft" width="284" height="76"></canvas>
<div id="info">实时预览固件首页 UI · 时钟自动走秒<br>
改 <b>HAL/ui.c</b> 布局后，同步调整本文件即可预览，无需编译烧录</div>

<script>
const c = document.getElementById('tft');
const ctx = c.getContext('2d');

/* ── 颜色（与 st7789.h 一致） ── */
const BLACK=0x0000, WHITE=0xFFFF, GREEN=0x07E0, YELLOW=0xFFE0;

/* RGB565 → CSS */
function rgb565(v){
  const r=((v>>11)&0x1f)*8, g=((v>>5)&0x3f)*4, b=(v&0x1f)*8;
  return `rgb(${r},${g},${b})`;
}

/* ── 5×7 字体（数字+字母，与固件 font_5x7 同格式：5列，bit7顶） ── */
const FONT = {
  ' ':[0x00,0x00,0x00,0x00,0x00],'!':[0x00,0x00,0x7D,0x00,0x00],
  '"':[0x00,0x60,0x00,0x60,0x00],"'":[0x00,0x60,0x40,0x00,0x00],
  '#':[0x28,0x7C,0x28,0x7C,0x28],'$':[0x12,0x2A,0x7F,0x2A,0x24],
  '%':[0x20,0x4C,0x76,0x20,0x04],'&':[0x04,0x3A,0x4E,0x20,0x06],
  '(':[0x00,0x18,0x24,0x42,0x00],')':[0x00,0x42,0x24,0x18,0x00],
  '*':[0x00,0x28,0x10,0x28,0x00],'+':[0x10,0x10,0x7C,0x10,0x10],

  '.':[0x00,0x00,0x06,0x06,0x00],'/':[0x04,0x08,0x10,0x20,0x40],
  '0':[0x3C,0x42,0x42,0x7E,0x3C],'1':[0x00,0x22,0x7E,0x02,0x00],
  '2':[0x42,0x46,0x4A,0x52,0x62],'3':[0x46,0x42,0x52,0x52,0x6E],
  '4':[0x08,0x18,0x28,0x7E,0x08],'5':[0x7A,0x4A,0x4A,0x4A,0x4E],
  '6':[0x1C,0x32,0x52,0x5E,0x0C],'7':[0x40,0x46,0x48,0x50,0x60],
  '8':[0x34,0x4A,0x4A,0x7E,0x34],'9':[0x30,0x49,0x49,0x79,0x3E],
  ':':[0x00,0x00,0x6C,0x00,0x00],';':[0x00,0x02,0x6C,0x00,0x00],
  '<':[0x00,0x10,0x28,0x44,0x00],'=':[0x28,0x28,0x28,0x28,0x28],
  '>':[0x00,0x44,0x28,0x10,0x00],'?':[0x20,0x40,0x4A,0x50,0x20],
  '@':[0x3C,0x42,0x5A,0x5A,0x38],
  'A':[0x1E,0x30,0x50,0x30,0x1E],'B':[0x7E,0x52,0x52,0x52,0x2C],
  'C':[0x3C,0x42,0x42,0x42,0x24],'D':[0x7E,0x42,0x42,0x42,0x3C],
  'E':[0x7E,0x52,0x52,0x52,0x42],'F':[0x7E,0x50,0x50,0x50,0x40],
  'G':[0x3C,0x42,0x42,0x4A,0x2E],'H':[0x7E,0x10,0x10,0x10,0x7E],
  'I':[0x00,0x42,0x7E,0x42,0x00],'J':[0x00,0x04,0x42,0x42,0x7C],
  'K':[0x7E,0x10,0x10,0x28,0x46],'L':[0x7E,0x02,0x02,0x02,0x02],
  'M':[0x7E,0x20,0x18,0x20,0x7E],'N':[0x7E,0x20,0x10,0x08,0x7E],
  'O':[0x3C,0x42,0x42,0x42,0x3C],'P':[0x7E,0x48,0x48,0x48,0x30],
  'Q':[0x3C,0x42,0x4A,0x44,0x3A],'R':[0x7E,0x48,0x48,0x4C,0x32],
  'S':[0x22,0x52,0x52,0x52,0x4C],'T':[0x40,0x40,0x7E,0x40,0x40],
  'U':[0x7C,0x02,0x02,0x02,0x7C],'V':[0x78,0x04,0x02,0x04,0x78],
  'W':[0x7E,0x04,0x18,0x04,0x7E],'X':[0x46,0x28,0x10,0x28,0x46],
  'Y':[0x40,0x20,0x1E,0x20,0x40],'Z':[0x42,0x46,0x4A,0x52,0x62],
  '[':[0x00,0x7E,0x42,0x42,0x00],']':[0x00,0x42,0x42,0x7E,0x00],
  '_':[0x02,0x02,0x02,0x02,0x02],'|':[0x00,0x00,0x7E,0x00,0x00],
  'a':[0x16,0x28,0x28,0x28,0x1E],'b':[0x7E,0x12,0x12,0x12,0x0C],
  'c':[0x1C,0x22,0x22,0x22,0x14],'d':[0x0C,0x12,0x12,0x12,0x7E],
  'e':[0x1C,0x2A,0x2A,0x2A,0x18],'f':[0x10,0x3E,0x50,0x40,0x00],
  'g':[0x12,0x29,0x29,0x29,0x3E],'h':[0x7E,0x10,0x10,0x10,0x0E],
  'i':[0x00,0x02,0x5E,0x12,0x00],'j':[0x00,0x02,0x01,0x11,0x5E],
  'k':[0x7E,0x08,0x08,0x14,0x02],'l':[0x00,0x42,0x7E,0x02,0x00],
  'm':[0x3E,0x20,0x18,0x20,0x1E],'n':[0x3E,0x20,0x20,0x20,0x1E],
  'o':[0x1C,0x22,0x22,0x22,0x1C],'p':[0x3E,0x28,0x28,0x28,0x10],
  'q':[0x10,0x28,0x28,0x28,0x3E],'r':[0x3E,0x10,0x20,0x20,0x10],
  's':[0x12,0x2A,0x2A,0x2A,0x24],'t':[0x10,0x7C,0x12,0x02,0x00],
  'u':[0x3C,0x02,0x02,0x02,0x3E],'v':[0x38,0x04,0x02,0x04,0x38],
  'w':[0x3E,0x04,0x18,0x04,0x3E],'x':[0x22,0x14,0x08,0x14,0x22],
  'y':[0x32,0x09,0x09,0x09,0x3E],'z':[0x22,0x26,0x2A,0x32,0x22],
};

/* ── 模拟 ST7789 绘制 API ── */
function fill(color){ ctx.fillStyle=rgb565(color); ctx.fillRect(0,0,284,76); }
function fillRect(x,y,w,h,color){ ctx.fillStyle=rgb565(color); ctx.fillRect(x,y,w,h); }
function drawPixel(x,y,color){ ctx.fillStyle=rgb565(color); ctx.fillRect(x,y,1,1); }
function drawHLine(x,y,w,color){ fillRect(x,y,w,1,color); }
function drawVLine(x,y,h,color){ fillRect(x,y,1,h,color); }

/* drawString: 5×7 位图，z=缩放。fy=固件坐标（0=底部），转换到 HTML（0=顶部）。
 * 字体位序与固件一致：bit7 顶（bit7 为空行），8 行 bit7..bit0。 */
function drawString(str, fx, fy, z, color){
  const fw=5*z, fh=8*z;
  const hy=76-fy-fh;              /* 固件 y=0 底部 → HTML 底部 */
  let x=fx;
  for(const ch of str){
    const g=FONT[ch]||[0,0,0,0,0];
    for(let col=0;col<5;col++){
      for(let row=0;row<8;row++){
        if(g[col]&(0x80>>row)){    /* bit7 顶，8 行（与固件一致） */
          fillRect(x+col*z, hy+row*z, z, z, color);
        }
      }
    }
    x+=fw+z;                        /* 字符+间距 */
  }
}

/* 电池图标（fy=固件坐标） */
function battery(x,fy){
  const y=76-fy-7;
  drawHLine(x,y,12,WHITE); drawHLine(x,y+6,12,WHITE);
  drawVLine(x,y,7,WHITE);   drawVLine(x+11,y,7,WHITE);
  drawPixel(x+12,y+2,WHITE); drawPixel(x+12,y+3,WHITE); drawPixel(x+12,y+4,WHITE);
  fillRect(x+1,y+1,8,5,WHITE);
}

/* 对勾（fy=固件坐标） */
function check(x,fy){
  const y=76-fy-5;
  const p=[[0,4],[1,3],[2,2],[3,1],[4,0],[2,4],[3,3]];
  for(const [dx,dy] of p) drawPixel(x+dx,y+dy,GREEN);
}

/* ── 首页渲染（固件坐标，与 ui.c 一致） ── */
function renderHome(h,m,s){
  const date=new Date();
  const pad=n=>String(n).padStart(2,'0');

  fill(BLACK);
  /* 顶部：USB MODE + 电池 */
  drawString('USB MODE', 0, 64, 1, GREEN);
  battery(250, 62);

  /* 中间：HH:MM（3× 居中）+ 秒 */
  drawString(`${pad(h)}:${pad(m)}`, 98, 26, 3, WHITE);
  drawString(pad(s), 195, 38, 1, WHITE);

  /* 底部：自定义文字（左下）+ 日期 + 模式 */
  drawString('FinPad', 0, 0, 1, YELLOW);       /* 自定义文字示例 */
  const y=date.getFullYear(), mo=pad(date.getMonth()+1), d=pad(date.getDate());
  drawString(`${y}-${mo}-${d}`, 112, 8, 1, YELLOW);
  drawString('MODA', 210, 0, 1, YELLOW);
  check(240, 0);
}

/* ── 实时走秒 ── */
let t=new Date();
function tick(){
  t=new Date(t.getTime()+1000);
  renderHome(t.getHours(), t.getMinutes(), t.getSeconds());
}
renderHome(t.getHours(), t.getMinutes(), t.getSeconds());
setInterval(tick, 1000);
</script>
